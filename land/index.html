<body class="watch-page">
<header class="mast">
  <div class="wrap mast-inner">
    <a class="brand" href="../"><span>domainhound.dev</span></a>
    <nav aria-label="Main"><a href="../#real-search">Example</a><a href="../watch/">Watch</a></nav>
  </div>
</header>
<main class="hero">
  <div class="wrap hero-grid">
      <div class="paper-art" aria-hidden="true">
        <span class="paper-word first">Domain</span>
        <span class="paper-word second">Hound</span>
        <span class="paper-dog"><img src="../assets/hound-mark.svg" width="180" height="180" alt=""></span>
      </div>
      <div class="lead">
        <h1 id="land-title">Help me get a taken domain.</h1>
        <p class="subline">We’ll look at who holds it and come back with a plan.</p>
      </div>
      <form class="watch" id="land" novalidate aria-labelledby="land-title" autocomplete="off">
        <p class="watch-intro">Confirm your request by email.</p>
        <div class="watch-controls">
          <div class="watch-field">
            <label for="land-domain">Domain</label>
            <input id="land-domain" required type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="brightname.com">
          </div>
          <div class="watch-field">
            <label for="land-email">Email</label>
            <input id="land-email" required type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="you@example.com">
          </div>
          <div class="watch-field">
            <label for="land-name">Name (optional)</label>
            <input id="land-name" type="text" autocomplete="name" maxlength="80">
          </div>
          <div class="watch-field">
            <label for="land-note">Note (optional)</label>
            <textarea id="land-note" rows="2" maxlength="500"></textarea>
          </div>
        </div>
        <label class="watch-news"><input id="land-news" type="checkbox" autocomplete="off"> <span>Yes, email me news about Domain Hound and other developer tools from BrightBoard AS. At most twice a month. Unsubscribe any time.</span></label>
        <div hidden><label for="land-website">Website</label><input id="land-website" type="text" tabindex="-1" autocomplete="off"></div>
        <button class="watch-submit action" type="submit" disabled>Send request</button>
        <noscript><p>Turn on JavaScript to send your request.</p></noscript>
        <p class="watch-status" id="land-status" role="status"></p>
        <div class="watch-help">
          <a href="../privacy/#land-requests">Privacy</a>
        </div>
      </form>
  </div>
</main>
<footer><div class="wrap foot"><a href="../">domainhound.dev</a><a href="../guides/">Guides</a><a href="../privacy/">Privacy</a></div></footer>
<script src="../assets/watch.js"></script>
</body>
</html>
